; PlatformIO Project Configuration File
;
; Elke oefening heeft een eigen environment. Kies in VS Code onderaan de
; statusbalk de juiste env (oefening1/2/3), of via de CLI:
;   pio run -e oefening2 -t upload
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = oefening3

[env]
platform = espressif32@6.5.0
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200
lib_deps =
    painlessmesh/painlessMesh@^1.5.0
    bblanchon/ArduinoJson@^6.21.5

[env:oefening1]
build_src_filter = +<oefening1.cpp>

[env:oefening2]
build_src_filter = +<oefening2.cpp>

[env:oefening3]
build_src_filter = +<oefening3.cpp>

; Oefening 4: knop buiten -> LED binnen via relay-nodes
[env:oefening4_buiten]
build_src_filter = +<oefening4.cpp>
build_flags = -D ROL_BUITEN

[env:oefening4_relay]
build_src_filter = +<oefening4.cpp>
build_flags = -D ROL_RELAY

[env:oefening4_binnen]
build_src_filter = +<oefening4.cpp>
build_flags = -D ROL_BINNEN

; Workshop deel 1: Node A (base, aan laptop) en Nodes B/C/D (mobiel)
[env:workshop1_base]
build_src_filter = +<workshop1.cpp>
build_flags = -D BASE_NODE=1

[env:workshop1_mobiel]
build_src_filter = +<workshop1.cpp>
build_flags = -D BASE_NODE=0

; Workshop deel 1, opdracht 2 + 3: Strategie B (beacon + sendSingle)
[env:workshop2_base]
build_src_filter = +<workshop2.cpp>
build_flags = -D BASE_NODE=1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

[env:workshop2_mobiel]
build_src_filter = +<workshop2.cpp>
build_flags = -D BASE_NODE=0
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0
